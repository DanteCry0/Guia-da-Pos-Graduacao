name: Atualizar programas CAPES

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixar programas da API da CAPES
        run: node scripts/atualizar-programas.mjs
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain public/data/programas.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/programas.json
            git commit -m "Atualiza programas CAPES"
            git push
          else
            echo "Sem mudanças."
          fi
